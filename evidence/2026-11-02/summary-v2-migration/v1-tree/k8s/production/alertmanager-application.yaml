apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-alertmanager
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://gitlab-service.ns-devops.svc.cluster.local/root/petclinic-platform.git
    targetRevision: main
    path: infra/observability/alertmanager
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
