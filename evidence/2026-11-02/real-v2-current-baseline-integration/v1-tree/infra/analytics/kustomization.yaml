apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - airflow/config.json
  - airflow/airflow-api-server.json
  - airflow/airflow-scheduler.json
  - airflow/airflow-dag-processor.json
  - airflow/airflow-triggerer.json
  - airflow/airflow-statsd.json
  - airflow/orchestration-rbac.yaml
configMapGenerator:
  - name: petclinic-analysis-code
    namespace: data-infra
    files:
      - clinic_task.py=clinic_task.py
      - petclinic_dag.py=petclinic_dag.py
      - clinic_snapshot.py=spark/clinic_snapshot.py
      - clinic_windows.sql=flink/clinic_windows.sql
      - schema.sql=schema.sql
      - verify_chart.py=superset/verify_chart.py
generatorOptions:
  disableNameSuffixHash: true
