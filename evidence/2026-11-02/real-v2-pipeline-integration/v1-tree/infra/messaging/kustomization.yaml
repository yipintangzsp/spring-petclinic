apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - resources.json
configMapGenerator:
  - name: clinic-message-code
    namespace: petclinic
    files:
      - worker.py
# Retained, Git-reconstructable code history must not block application sync.
# Only generated ConfigMaps receive this annotation; Deployment/NetworkPolicy stay strict.
generatorOptions:
  annotations:
    argocd.argoproj.io/compare-options: IgnoreExtraneous
