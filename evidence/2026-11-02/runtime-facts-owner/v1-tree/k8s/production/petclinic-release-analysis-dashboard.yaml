apiVersion: v1
kind: ConfigMap
metadata:
  name: petclinic-release-analysis-dashboard
  namespace: petclinic
  labels:
    grafana_dashboard: "1"
data:
  petclinic-release-analysis.json: |
    {
      "uid": "petclinic-release-analysis",
      "title": "Petclinic · 发布与分析验收",
      "description": "真实 HTTP、Pod、JVM、连接池、Jenkins 最近构建及隔离统计结果。业务数量跨副本取 max；Airflow 指标为既有 StatsD 进程累计，重启会归零。Spark/Flink 按需运行时的历史峰值及 Job IDs 见验收文档，正常关闭不是错误。 按需 Airflow 关闭时从过去24h真实采样读取累计；窗口超过保留区间时显示无数据。",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "title": "业务响应 P95",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 8,
            "h": 7
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.95,sum by(le)(rate(http_server_requests_seconds_bucket{namespace=\"petclinic\"}[5m])))",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "{{pod}}{{task_id}}"
            }
          ],
          "options": {
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 2,
          "title": "HTTP 请求速率",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 8,
            "y": 0,
            "w": 8,
            "h": 7
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(http_server_requests_seconds_count{namespace=\"petclinic\"}[5m]))",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "{{pod}}{{task_id}}"
            }
          ],
          "options": {
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 3,
          "title": "HTTP 5xx 比例",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 16,
            "y": 0,
            "w": 8,
            "h": 7
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "(sum(rate(http_server_requests_seconds_count{namespace=\"petclinic\",status=~\"5..\"}[5m])) or (sum(rate(http_server_requests_seconds_count{namespace=\"petclinic\"}[5m]))*0)) / clamp_min(sum(rate(http_server_requests_seconds_count{namespace=\"petclinic\"}[5m])),0.001)",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "{{pod}}{{task_id}}"
            }
          ],
          "options": {
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 4,
          "title": "Pod 内存",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 7,
            "w": 8,
            "h": 7
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by(pod)(container_memory_working_set_bytes{namespace=\"petclinic\",container=\"petclinic\"})",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "{{pod}}{{task_id}}"
            }
          ],
          "options": {
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 5,
          "title": "Pod CPU",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 8,
            "y": 7,
            "w": 8,
            "h": 7
          },
          "fieldConfig": {
            "defaults": {
              "unit": "cores"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by(pod)(rate(container_cpu_usage_seconds_total{namespace=\"petclinic\",container=\"petclinic\"}[5m]))",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "{{pod}}{{task_id}}"
            }
          ],
          "options": {
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 6,
          "title": "JVM 堆",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 16,
            "y": 7,
            "w": 8,
            "h": 7
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by(pod)(jvm_memory_used_bytes{namespace=\"petclinic\",area=\"heap\"})",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "{{pod}}{{task_id}}"
            }
          ],
          "options": {
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 7,
          "title": "Hikari 活跃连接",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 14,
            "w": 8,
            "h": 7
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "hikaricp_connections_active{namespace=\"petclinic\"}",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "{{pod}}{{task_id}}"
            }
          ],
          "options": {
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 8,
          "title": "最近完成构建编号",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 8,
            "y": 14,
            "w": 8,
            "h": 7
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max(petclinic_pipeline_last_completed_build)",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "{{pod}}{{task_id}}"
            }
          ],
          "options": {
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 9,
          "title": "最近构建成功（1=成功）",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 16,
            "y": 14,
            "w": 8,
            "h": 7
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max(petclinic_pipeline_last_success)",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "{{pod}}{{task_id}}"
            }
          ],
          "options": {
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 10,
          "title": "最近构建耗时",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 21,
            "w": 8,
            "h": 7
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max(petclinic_pipeline_last_duration_seconds)",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "{{pod}}{{task_id}}"
            }
          ],
          "options": {
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 11,
          "title": "当前构建中（1=是）",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 8,
            "y": 21,
            "w": 8,
            "h": 7
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max(petclinic_pipeline_building)",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "{{pod}}{{task_id}}"
            }
          ],
          "options": {
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 12,
          "title": "最近成功统计窗口就诊数",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 16,
            "y": 21,
            "w": 8,
            "h": 7
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max(petclinic_analysis_window_visits{namespace=\"petclinic\"})",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "{{pod}}{{task_id}}"
            }
          ],
          "options": {
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 13,
          "title": "统计更新时间距今",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 28,
            "w": 8,
            "h": 7
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "time()-max(petclinic_analysis_last_success_seconds{namespace=\"petclinic\"})",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "{{pod}}{{task_id}}"
            }
          ],
          "options": {
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 14,
          "title": "统计读取失败（1=是）",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 8,
            "y": 28,
            "w": 8,
            "h": 7
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max(petclinic_analysis_read_failed{namespace=\"petclinic\"})",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "{{pod}}{{task_id}}"
            }
          ],
          "options": {
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 15,
          "title": "Airflow 24h 内观测到的成功累计",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 16,
            "y": 28,
            "w": 8,
            "h": 7
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max_over_time(airflow_ti_successes[24h])",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "{{pod}}{{task_id}}"
            }
          ],
          "options": {
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 16,
          "title": "Airflow 24h 内观测到的读取重试",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 35,
            "w": 8,
            "h": 7
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max_over_time(airflow_ti_finish_petclinic_insights_bounded_read_up_for_retry[24h])",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "{{pod}}{{task_id}}"
            }
          ],
          "options": {
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 17,
          "title": "Airflow 任务平均耗时",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 8,
            "y": 35,
            "w": 8,
            "h": 7
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max_over_time(airflow_task_duration_sum[24h]) / clamp_min(max_over_time(airflow_task_duration_count[24h]),1)",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "{{pod}}{{task_id}}"
            }
          ],
          "options": {
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 18,
          "title": "按需计算期望副本（0=关闭）",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 16,
            "y": 35,
            "w": 8,
            "h": 7
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "kube_deployment_spec_replicas{namespace=~\"data-infra|ns-bigdata\",deployment=~\"airflow-.*|flink-.*|spark-operator-.*\"}",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "{{pod}}{{task_id}}"
            }
          ],
          "options": {
            "tooltip": {
              "mode": "multi"
            }
          }
        }
      ],
      "tags": [
        "petclinic",
        "release",
        "analytics"
      ]
    }
