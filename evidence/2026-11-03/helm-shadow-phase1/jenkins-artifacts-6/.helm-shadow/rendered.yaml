# Source: petclinic/templates/pdb.yaml
{
  "apiVersion": "policy/v1",
  "kind": "PodDisruptionBudget",
  "metadata": {
    "name": "petclinic",
    "namespace": "petclinic"
  },
  "spec": {
    "minAvailable": 2,
    "selector": {
      "matchLabels": {
        "app": "petclinic"
      }
    },
    "unhealthyPodEvictionPolicy": "AlwaysAllow"
  }
}
