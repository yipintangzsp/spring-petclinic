# Source: petclinic/templates/observability.yaml
{
  "apiVersion": "monitoring.coreos.com/v1",
  "kind": "PrometheusRule",
  "metadata": {
    "labels": {
      "release": "kube-stack"
    },
    "name": "petclinic",
    "namespace": "petclinic"
  },
  "spec": {
    "groups": [
      {
        "name": "petclinic.rules",
        "rules": [
          {
            "alert": "PetclinicTargetDown",
            "annotations": {
              "description": "Prometheus cannot scrape Petclinic target {{ $labels.pod }} for more than 2 minutes.",
              "summary": "Petclinic target is down"
            },
            "expr": "up{namespace=\"petclinic\",job=\"petclinic\"} == 0\n",
            "for": "2m",
            "labels": {
              "service": "petclinic",
              "severity": "warning"
            }
          },
          {
            "alert": "PetclinicHigh5xxRate",
            "annotations": {
              "description": "Petclinic 5xx ratio has exceeded 5% for more than 5 minutes.",
              "summary": "Petclinic 5xx error rate is high"
            },
            "expr": "(\n  sum(rate(http_server_requests_seconds_count{\n    namespace=\"petclinic\",\n    job=\"petclinic\",\n    status=~\"5..\",\n    uri!~\"/actuator.*\"\n  }[5m]))\n  /\n  sum(rate(http_server_requests_seconds_count{\n    namespace=\"petclinic\",\n    job=\"petclinic\",\n    uri!~\"/actuator.*\"\n  }[5m]))\n) \u003e 0.05\nand\nsum(rate(http_server_requests_seconds_count{\n  namespace=\"petclinic\",\n  job=\"petclinic\",\n  uri!~\"/actuator.*\"\n}[5m])) \u003e 0.1\n",
            "for": "5m",
            "labels": {
              "service": "petclinic",
              "severity": "warning"
            }
          }
        ]
      }
    ]
  }
}
