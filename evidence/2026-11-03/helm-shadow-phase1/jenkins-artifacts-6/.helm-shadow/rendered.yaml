              {
                "containerPort": 8080,
                "name": "http"
              }
            ],
            "readinessProbe": {
              "failureThreshold": 6,
              "httpGet": {
                "path": "/actuator/health/readiness",
                "port": "http"
              },
              "periodSeconds": 10,
              "timeoutSeconds": 3
            },
            "resources": {
              "limits": {
                "cpu": "500m",
                "memory": "768Mi"
              },
              "requests": {
                "cpu": "100m",
                "memory": "512Mi"
              }
            },
            "securityContext": {
              "allowPrivilegeEscalation": false,
              "capabilities": {
                "drop": [
                  "ALL"
                ]
              },
              "readOnlyRootFilesystem": true
            },
            "startupProbe": {
              "failureThreshold": 36,
              "httpGet": {
                "path": "/actuator/health/liveness",
                "port": "http"
              },
              "periodSeconds": 5,
              "timeoutSeconds": 3
            },
            "volumeMounts": [
              {
                "mountPath": "/tmp",
                "name": "runtime-tmp"
              },
              {
                "mountPath": "/etc/petclinic-platform",
                "name": "platform-snapshot",
                "readOnly": true
              }
            ]
          }
        ],
        "imagePullSecrets": [
          {
            "name": "petclinic-harbor-pull"
          }
        ],
        "nodeSelector": {
          "kubernetes.io/hostname": "devops",
          "kubernetes.io/os": "linux"
        },
        "securityContext": {
          "fsGroup": 10001,
          "runAsGroup": 10001,
          "runAsNonRoot": true,
          "runAsUser": 10001,
          "seccompProfile": {
            "type": "RuntimeDefault"
          }
        },
        "terminationGracePeriodSeconds": 45,
        "tolerations": [
          {
            "effect": "NoSchedule",
            "key": "cloud",
            "operator": "Equal",
            "value": "true"
          }
        ],
        "topologySpreadConstraints": [
          {
            "labelSelector": {
              "matchLabels": {
                "app": "petclinic"
              }
            },
            "matchLabelKeys": [
              "pod-template-hash"
            ],
            "maxSkew": 1,
            "topologyKey": "kubernetes.io/hostname",
            "whenUnsatisfiable": "ScheduleAnyway"
          }
        ],
        "volumes": [
          {
            "emptyDir": {
              "sizeLimit": "128Mi"
            },
            "name": "runtime-tmp"
          },
          {
            "configMap": {
              "name": "petclinic-platform-snapshot",
              "optional": true
            },
            "name": "platform-snapshot"
          }
        ]
      }
    }
  }
}
