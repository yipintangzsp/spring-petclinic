apiVersion: apps/v1
kind: Deployment
metadata:
  name: petclinic
  namespace: petclinic
  annotations:
    gitops.zhanglab.io/cutover-test: "v1.27"

spec:
  replicas: 3
  minReadySeconds: 10
  progressDeadlineSeconds: 600
  revisionHistoryLimit: 5

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      app: petclinic

  template:
    metadata:
      labels:
        app: petclinic

    spec:
      # Current release passed isolated image/network/DB/metrics/log acceptance
      # on both amd64 workers (2026-10-06). Allow all three Linux nodes.
      nodeSelector:
        kubernetes.io/os: linux

      tolerations:
        - key: cloud
          operator: Equal
          value: "true"
          effect: NoSchedule

      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          # Keep spreading as a preference so a NotReady worker cannot block
          # a safe 3-replica rollout on the remaining healthy nodes.
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: petclinic
          matchLabelKeys:
            - pod-template-hash

      automountServiceAccountToken: false
      # 5s endpoint propagation + 25s application shutdown phase + margin.
      terminationGracePeriodSeconds: 45

      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001

      containers:
        - name: petclinic
          image: 10.0.0.3:30050/petclinic/petclinic:0.9.0-ci-101
          imagePullPolicy: IfNotPresent

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          ports:
            - name: http
              containerPort: 8080

          env:
            - name: SERVER_SHUTDOWN
              value: graceful
            - name: SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE
              value: 25s
            # Preserve probes/metrics without exposing administrative endpoints.
            - name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
              value: health,info,prometheus,metrics
            # Prometheus scrapes metrics; OTLP traces remain enabled.
            - name: MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED
              value: 'false'
            - name: MANAGEMENT_TRACING_EXPORT_OTLP_ENABLED
              value: 'true'
            - name: MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT
              value: http://otel-collector.monitoring.svc.cluster.local:4318/v1/traces
            - name: MANAGEMENT_TRACING_SAMPLING_PROBABILITY
              value: '1.0'
            # Updated together with the immutable image tag by Jenkins Git promotion.
            - name: APPLICATION_VERSION
              value: '0.9.0-ci-101'
            - name: BUILD_NUMBER
              value: '101'
            - name: BUILD_GIT_COMMIT
              value: 'f1cd03af608511ba579ef9721bec18e96b21e060'
            - name: BUILD_TIME
              value: '2026-10-03T16:13:46Z'

            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: petclinic-config
                  key: SPRING_PROFILES_ACTIVE

            - name: POSTGRES_URL
              valueFrom:
                configMapKeyRef:
                  name: petclinic-config
                  key: POSTGRES_URL

            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: petclinic-db
                  key: POSTGRES_USER

            - name: POSTGRES_PASS
              valueFrom:
                secretKeyRef:
                  name: petclinic-db
                  key: POSTGRES_PASS

          volumeMounts:
            - name: platform-snapshot
              mountPath: /etc/petclinic-platform
              readOnly: true

          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]

          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 36

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi

      volumes:
        - name: platform-snapshot
          configMap:
            name: petclinic-platform-snapshot
            optional: true

---
apiVersion: v1
kind: Service
metadata:
  name: petclinic
  namespace: petclinic

spec:
  type: ClusterIP

  selector:
    app: petclinic

  ports:
    - name: http
      port: 80
      targetPort: http

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: petclinic
  namespace: petclinic

spec:
  ingressClassName: traefik

  rules:
    - host: petclinic.devops.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: petclinic
                port:
                  number: 80
