apiVersion: v1
kind: ConfigMap
metadata:
  name: petclinic-metrics-dashboard
  namespace: petclinic
  labels:
    grafana_dashboard: "1"
data:
  petclinic-application-metrics.json: |
    {
      "annotations": {
        "list": []
      },
      "description": "Petclinic Pod readiness, resource usage, HTTP status and latency, JVM and structured ECS errors. Empty error log results mean no matching errors in the selected range. Hikari pool pressure.",
      "editable": true,
      "graphTooltip": 1,
      "links": [],
      "panels": [
        {
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "id": 100,
          "panels": [],
          "title": "APPLICATION METRICS",
          "type": "row"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "Business HTTP request rate across all Petclinic pods. Actuator traffic is excluded.",
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 1
          },
          "id": 1,
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "single"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "sum(rate(http_server_requests_seconds_count{namespace=\"petclinic\",job=\"petclinic\",uri!~\"/actuator/.*\"}[$__rate_interval]))",
              "legendFormat": "Petclinic",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Request Rate",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "Percentage of business HTTP requests returning a 5xx status.",
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 5
                  }
                ]
              },
              "unit": "percent"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 1
          },
          "id": 2,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "wideLayout": true
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "100 * (sum(rate(http_server_requests_seconds_count{namespace=\"petclinic\",job=\"petclinic\",uri!~\"/actuator/.*\",status=~\"5..\"}[$__rate_interval])) or vector(0)) / clamp_min(sum(rate(http_server_requests_seconds_count{namespace=\"petclinic\",job=\"petclinic\",uri!~\"/actuator/.*\"}[$__rate_interval])), 0.000001)",
              "instant": true,
              "refId": "A"
            }
          ],
          "title": "5xx Error Rate",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "95th percentile response latency for business HTTP requests.",
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 9
          },
          "id": 3,
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "single"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{namespace=\"petclinic\",job=\"petclinic\",uri!~\"/actuator/.*\"}[$__rate_interval])))",
              "legendFormat": "P95",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "P95 Latency",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "Current JVM heap consumption for each Petclinic pod.",
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 9
          },
          "id": 4,
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "sum by (pod) (jvm_memory_used_bytes{namespace=\"petclinic\",job=\"petclinic\",area=\"heap\"})",
              "legendFormat": "{{pod}}",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "JVM Heap Used by Pod",
          "type": "timeseries"
        },
        {
          "id": 101,
          "type": "timeseries",
          "title": "Pod Ready (1=ready)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 17,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "kube_pod_status_ready{namespace=\"petclinic\",condition=\"true\",pod=~\"petclinic-.*\"}",
              "legendFormat": "{{pod}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 102,
          "type": "timeseries",
          "title": "CPU Used by Pod",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 17,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by(pod)(rate(container_cpu_usage_seconds_total{namespace=\"petclinic\",container=\"petclinic\"}[$__rate_interval]))",
              "legendFormat": "{{pod}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "cores"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 103,
          "type": "timeseries",
          "title": "Memory Working Set / Request / Limit",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 25,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "container_memory_working_set_bytes{namespace=\"petclinic\",container=\"petclinic\"}",
              "legendFormat": "{{pod}} used"
            },
            {
              "refId": "B",
              "expr": "kube_pod_container_resource_requests{namespace=\"petclinic\",container=\"petclinic\",resource=\"memory\",unit=\"byte\"}",
              "legendFormat": "{{pod}} request"
            },
            {
              "refId": "C",
              "expr": "kube_pod_container_resource_limits{namespace=\"petclinic\",container=\"petclinic\",resource=\"memory\",unit=\"byte\"}",
              "legendFormat": "{{pod}} limit"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 104,
          "type": "timeseries",
          "title": "HTTP Status Codes",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 25,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by(status)(rate(http_server_requests_seconds_count{namespace=\"petclinic\",job=\"petclinic\",uri!~\"/actuator.*\"}[$__rate_interval]))",
              "legendFormat": "HTTP {{status}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 105,
          "type": "timeseries",
          "title": "Pod Restarts (last hour)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 33,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "increase(kube_pod_container_status_restarts_total{namespace=\"petclinic\",container=\"petclinic\"}[1h])",
              "legendFormat": "{{pod}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 106,
          "type": "timeseries",
          "title": "JVM GC Pause per Second",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 33,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by(pod)(rate(jvm_gc_pause_seconds_sum{namespace=\"petclinic\",job=\"petclinic\"}[$__rate_interval]))",
              "legendFormat": "{{pod}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 107,
          "type": "logs",
          "title": "ECS Error / Fatal Logs",
          "description": "Parses log.level from existing ECS JSON at query time. Trace IDs remain JSON fields, not stream labels. Empty results can mean no errors; confirm the Loki stream separately.",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "gridPos": {
            "x": 0,
            "y": 41,
            "w": 24,
            "h": 10
          },
          "targets": [
            {
              "refId": "A",
              "expr": "{app=\"petclinic\",namespace=\"petclinic\"} | json severity=\"log.level\" | severity=~\"ERROR|FATAL\""
            }
          ],
          "options": {
            "showTime": true,
            "showLabels": false,
            "wrapLogMessage": true,
            "sortOrder": "Descending"
          }
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "Measured pool pressure and autoscaler intent; compare with Ready Pods and scheduler events.",
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "x": 0,
            "y": 51,
            "w": 12,
            "h": 8
          },
          "id": 201,
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "single"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "hikaricp_connections_active{namespace=\"petclinic\"}",
              "legendFormat": "{{pod}} active"
            },
            {
              "refId": "B",
              "expr": "hikaricp_connections_idle{namespace=\"petclinic\"}",
              "legendFormat": "{{pod}} idle"
            },
            {
              "refId": "C",
              "expr": "hikaricp_connections_pending{namespace=\"petclinic\"}",
              "legendFormat": "{{pod}} pending"
            }
          ],
          "title": "Hikari connection pool",
          "type": "timeseries"
        }
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": [
        "petclinic",
        "prometheus",
        "observability"
      ],
      "templating": {
        "list": []
      },
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "timezone": "browser",
      "title": "Petclinic Production Troubleshooting",
      "uid": "petclinic-app-metrics",
      "version": 3
    }
