fullnameOverride: platform-falco
nodeSelector:
  kubernetes.io/hostname: devops
  kubernetes.io/arch: arm64
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
driver:
  kind: modern_ebpf
  modernEbpf:
    leastPrivileged: true
    bufSizePreset: 2
    cpusForEachBuffer: 2
    dropFailedExit: false
  loader:
    enabled: false
falcoctl:
  artifact:
    install:
      enabled: false
    follow:
      enabled: false
falcosidekick:
  enabled: false
responseActions:
  enabled: false
collectors:
  containerEngine:
    engines:
      docker:
        enabled: false
      podman:
        enabled: false
      containerd:
        enabled: false
        sockets:
        - /run/k3s/containerd/containerd.sock
      cri:
        enabled: true
        sockets:
        - /run/k3s/containerd/containerd.sock
      lxc:
        enabled: false
      libvirt_lxc:
        enabled: false
      bpm:
        enabled: false
  kubernetes:
    enabled: false
containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
    add:
    - BPF
    - PERFMON
    - SYS_PTRACE
    - SYS_RESOURCE
  seccompProfile:
    type: Unconfined
  appArmorProfile:
    type: Unconfined
customRules:
  platform-rules.yaml: "- list: platform_runtime_namespaces\n  items:\n  - petclinic\n\
    \  - devsecops-test\n- macro: platform_runtime_scope\n  condition: container.id\
    \ != host and k8s.ns.name in (platform_runtime_namespaces)\n- macro: platform_expected_runtime_bootstrap\n\
    \  condition: proc.exepath=\"/var/lib/rancher/k3s/data/876326f0487c64e27190fea8c8c5f54263aabc782061df6455fa54c0f7e2a1ad/bin/runc\"\
    \n    and proc.name in (\"runc:[0:PARENT]\", \"runc:[1:CHILD]\") and proc.cmdline\
    \ in (\"runc:[0:PARENT]\n    init\", \"runc:[1:CHILD] init\", \"runc:[1:CHILD]\"\
    ) and ((k8s.ns.name=petclinic and\n    container.name in (worker, tests) and container.image.repository=\"\
    192.168.1.58:30050/platform-upgrade/airflow\")\n    or (k8s.ns.name=petclinic\
    \ and container.name=petclinic and container.image.repository=\"core.harbor.domain/petclinic/petclinic\"\
    )\n    or (k8s.ns.name=devsecops-test and container.name=test and container.image.repository=\"\
    127.0.0.1:30050/petclinic/petclinic\"))\n- rule: Platform Runtime Shell\n  desc:\
    \ Shell start in business or isolated security test namespace; an expected operator\n\
    \    exec is still auditable.\n  condition: platform_runtime_scope and (evt.type\
    \ in (execve, execveat) and evt.failed=false\n    and proc.name in (sh, bash,\
    \ dash, ash)) and not (k8s.ns.name=petclinic and container.name=worker\n    and\
    \ container.image.repository=\"192.168.1.58:30050/platform-upgrade/airflow\" and\n\
    \    proc.name=sh and proc.cmdline=\"sh -c kill -0 1\") and not (k8s.ns.name=petclinic\n\
    \    and container.name=petclinic and container.image.repository=\"core.harbor.domain/petclinic/petclinic\"\
    \n    and proc.exepath=\"/usr/bin/dash\" and proc.name=sh and proc.cmdline=\"\
    sh -c sleep\n    5\")\n  output: runtime_security node=%evt.hostname namespace=%k8s.ns.name\
    \ pod=%k8s.pod.name\n    container=%container.name image=%container.image.repository\
    \ process=%proc.name\n    command=%proc.cmdline user=%user.uid result=%evt.res\
    \ executable=%proc.exepath\n    syscall=%evt.type\n  priority: WARNING\n  tags:\n\
    \  - platform_runtime\n  - container\n- rule: Platform Runtime Sensitive Read\n\
    \  desc: Sensitive identity file read, including denied attempt; classify libc\
    \ lookup\n    noise from observed evidence.\n  condition: (platform_runtime_scope\
    \ and (evt.type in (open, openat, openat2) and\n    evt.is_open_read=true and\
    \ evt.arg.name in (/etc/shadow, /etc/passwd))) and not\n    platform_expected_runtime_bootstrap\n\
    \  output: runtime_security node=%evt.hostname namespace=%k8s.ns.name pod=%k8s.pod.name\n\
    \    container=%container.name image=%container.image.repository process=%proc.name\n\
    \    command=%proc.cmdline user=%user.uid result=%evt.res executable=%proc.exepath\n\
    \    syscall=%evt.type path=%evt.arg.name\n  priority: WARNING\n  tags:\n  - platform_runtime\n\
    \  - container\n- rule: Platform Runtime Package Manager\n  desc: Package manager\
    \ execution; tests use --version, never install software.\n  condition: platform_runtime_scope\
    \ and (evt.type in (execve, execveat) and evt.failed=false\n    and proc.name\
    \ in (apt, apt-get, yum, dnf, apk))\n  output: runtime_security node=%evt.hostname\
    \ namespace=%k8s.ns.name pod=%k8s.pod.name\n    container=%container.name image=%container.image.repository\
    \ process=%proc.name\n    command=%proc.cmdline user=%user.uid result=%evt.res\
    \ executable=%proc.exepath\n    syscall=%evt.type\n  priority: WARNING\n  tags:\n\
    \  - platform_runtime\n  - container\n- rule: Platform Runtime Network Utility\n\
    \  desc: Network utility execution, not proof of network exfiltration; tests use\
    \ --help\n    only.\n  condition: platform_runtime_scope and (evt.type in (execve,\
    \ execveat) and evt.failed=false\n    and proc.name in (nc, ncat, netcat, socat))\n\
    \  output: runtime_security node=%evt.hostname namespace=%k8s.ns.name pod=%k8s.pod.name\n\
    \    container=%container.name image=%container.image.repository process=%proc.name\n\
    \    command=%proc.cmdline user=%user.uid result=%evt.res executable=%proc.exepath\n\
    \    syscall=%evt.type\n  priority: WARNING\n  tags:\n  - platform_runtime\n \
    \ - container\n- rule: Platform Runtime HTTP Utility\n  desc: HTTP utility is\
    \ visibility, not automatically an attack. Expected use is reviewed\n    by exact\
    \ workload and command.\n  condition: platform_runtime_scope and (evt.type in\
    \ (execve, execveat) and evt.failed=false\n    and proc.name in (curl, wget))\n\
    \  output: runtime_security node=%evt.hostname namespace=%k8s.ns.name pod=%k8s.pod.name\n\
    \    container=%container.name image=%container.image.repository process=%proc.name\n\
    \    command=%proc.cmdline user=%user.uid result=%evt.res executable=%proc.exepath\n\
    \    syscall=%evt.type\n  priority: NOTICE\n  tags:\n  - platform_runtime\n  -\
    \ container\n- rule: Platform Runtime Namespace Or Mount\n  desc: Container namespace/mount\
    \ operation or tool, including unsuccessful attempts.\n    Not proof of an escape.\n\
    \  condition: (platform_runtime_scope and (evt.type in (mount, setns, unshare)\
    \ or (evt.type\n    in (execve, execveat) and proc.name in (mount, nsenter))))\
    \ and not platform_expected_runtime_bootstrap\n  output: runtime_security node=%evt.hostname\
    \ namespace=%k8s.ns.name pod=%k8s.pod.name\n    container=%container.name image=%container.image.repository\
    \ process=%proc.name\n    command=%proc.cmdline user=%user.uid result=%evt.res\
    \ executable=%proc.exepath\n    syscall=%evt.type\n  priority: ERROR\n  tags:\n\
    \  - platform_runtime\n  - container\n- rule: Platform Runtime Privilege\n  desc:\
    \ Execution in a privileged container or capability change syscall; no privileged\n\
    \    tests are created.\n  condition: (platform_runtime_scope and ((evt.type in\
    \ (execve, execveat) and evt.failed=false\n    and container.privileged=true)\
    \ or evt.type=capset)) and not platform_expected_runtime_bootstrap\n  output:\
    \ runtime_security node=%evt.hostname namespace=%k8s.ns.name pod=%k8s.pod.name\n\
    \    container=%container.name image=%container.image.repository process=%proc.name\n\
    \    command=%proc.cmdline user=%user.uid result=%evt.res executable=%proc.exepath\n\
    \    syscall=%evt.type\n  priority: ERROR\n  tags:\n  - platform_runtime\n  -\
    \ container\n- rule: Platform Runtime Sensitive Write\n  desc: Attempt to write\
    \ protected system paths, including readonly denial; never\n    treated as a successful\
    \ mutation without syscall result.\n  condition: platform_runtime_scope and (evt.type\
    \ in (open, openat, openat2, creat)\n    and (evt.arg.flags contains O_WRONLY\
    \ or evt.arg.flags contains O_RDWR or evt.arg.flags\n    contains O_CREAT) and\
    \ (evt.arg.name startswith /etc/ or evt.arg.name startswith\n    /usr/bin/ or\
    \ evt.arg.name startswith /usr/sbin/ or evt.arg.name startswith /bin/\n    or\
    \ evt.arg.name startswith /sbin/))\n  output: runtime_security node=%evt.hostname\
    \ namespace=%k8s.ns.name pod=%k8s.pod.name\n    container=%container.name image=%container.image.repository\
    \ process=%proc.name\n    command=%proc.cmdline user=%user.uid result=%evt.res\
    \ executable=%proc.exepath\n    syscall=%evt.type path=%evt.arg.name\n  priority:\
    \ ERROR\n  tags:\n  - platform_runtime\n  - container\n"
falco:
  json_output: true
  json_include_output_property: true
  json_include_tags_property: true
  priority: debug
  rules_files:
  - /etc/falco/rules.d/platform-rules.yaml
  log_stderr: true
  log_syslog: false
  stdout_output:
    enabled: true
  syslog_output:
    enabled: false
metrics:
  enabled: true
  interval: 30s
  libbpfStatsEnabled: false
serviceMonitor:
  create: true
  labels:
    release: kube-stack
podLabels:
  petclinic.devops.local/runtime-ruleset: 59752c1132f0
