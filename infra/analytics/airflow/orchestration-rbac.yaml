apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: petclinic-airflow-orchestrator
  namespace: data-infra
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log", "configmaps"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["get", "create"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: petclinic-airflow-orchestrator
  namespace: data-infra
subjects:
  - kind: ServiceAccount
    name: airflow-worker
    namespace: data-infra
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: petclinic-airflow-orchestrator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: petclinic-airflow-spark
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["configmaps", "pods", "pods/log", "services"]
    verbs: ["get", "list", "watch", "create", "delete", "patch"]
  - apiGroups: ["sparkoperator.k8s.io"]
    resources: ["sparkapplications", "sparkapplications/status"]
    verbs: ["get", "list", "watch", "create", "delete", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: petclinic-airflow-spark
  namespace: default
subjects:
  - kind: ServiceAccount
    name: airflow-worker
    namespace: data-infra
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: petclinic-airflow-spark
---
