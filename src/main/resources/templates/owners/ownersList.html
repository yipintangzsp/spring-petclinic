<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'owners')}">
<body><main class="clinic-workspace">
<header class="workspace-heading">
<div>
<p class="eyebrow"><span th:text="#{clinic.client.directory.database.records}">CLIENT DIRECTORY · DATABASE RECORDS</span></p>
<h1><span th:text="#{clinic.owners}">Owners</span></h1>
<p><span th:text="#{clinic.find.a.household.review.its.pets.and.continue.care}">Find a household, review its pets, and continue care.</span></p></div><a class="btn btn-primary" th:href="@{/owners/new}"><span th:text="#{clinic.add.owner}">Add owner</span></a></header>
<form class="filter-bar" method="get" th:action="@{/owners}">
<label><span th:text="#{clinic.owner.name.or.telephone}">Owner name or telephone</span><input class="form-control" name="q" th:value="${q}" placeholder="e.g. George or 608" maxlength="100"></label>
<label><span th:text="#{clinic.city}">City</span><select class="form-control" name="city"><option value="" th:text="#{clinic.all.cities}">All cities</option><option th:each="item : ${cities}" th:value="${item}" th:text="${item}" th:selected="${item == city}"></option></select></label>
<label><span th:text="#{clinic.sort.by}">Sort by</span><select class="form-control" name="sort"><option value="lastName" th:selected="${sort == 'lastName'}" th:text="#{clinic.last.name}">Last name</option><option value="firstName" th:selected="${sort == 'firstName'}" th:text="#{clinic.first.name}">First name</option><option value="city" th:selected="${sort == 'city'}" th:text="#{clinic.city}">City</option></select></label><button class="btn btn-primary"><span th:text="#{clinic.apply.filters}">Apply filters</span></button><a th:href="@{/owners}"><span th:text="#{clinic.clear}">Clear</span></a></form>
<p class="result-count" th:text="${totalItems} + ' matching owners · 5 per page'"></p>
<section class="empty-state" th:if="${#lists.isEmpty(listOwners)}">
<h2><span th:text="#{clinic.no.owners.found}">No owners found</span></h2>
<p><span th:text="#{clinic.try.another.name.or.clear.the.city.filter}">Try another name or clear the city filter.</span></p><a th:href="@{/owners}"><span th:text="#{clinic.show.all.owners}">Show all owners</span></a></section>
<div class="table-responsive">
<table id="owners" class="table table-striped" th:unless="${#lists.isEmpty(listOwners)}">
<thead>
<tr><th><span th:text="#{clinic.owner}">Owner</span></th><th><span th:text="#{clinic.contact}">Contact</span></th><th><span th:text="#{clinic.city.address}">City / address</span></th><th><span th:text="#{clinic.pets}">Pets</span></th></tr></thead>
<tbody>
<tr th:each="owner : ${listOwners}"><td><a class="record-link" th:href="@{/owners/{id}(id=${owner.id})}" th:text="${owner.firstName + ' ' + owner.lastName}"></a></td><td><a th:href="'tel:' + ${owner.telephone}" th:text="${owner.telephone}"></a></td><td><strong th:text="${owner.city}"></strong><small class="cell-note" th:text="${owner.address}"></small></td><td><a class="tag" th:each="pet : ${owner.pets}" th:href="@{/owners/{o}/pets/{p}(o=${owner.id},p=${pet.id})}" th:text="${pet.name}"></a><span th:if="${#lists.isEmpty(owner.pets)}"><span th:text="#{clinic.no.pets.registered}">No pets registered</span></span></td></tr></tbody></table></div>
<nav class="pager" aria-label="Pagination" th:if="${totalPages > 1}"><a class="btn btn-outline-primary" th:if="${currentPage > 1}" th:href="@{/owners(page=${currentPage - 1},q=${q},city=${city},sort=${sort},lastName=${legacyLastName})}">← Previous</a><span th:text="'Page ' + ${currentPage} + ' of ' + ${totalPages}"></span><a class="btn btn-outline-primary" th:if="${currentPage < totalPages}" th:href="@{/owners(page=${currentPage + 1},q=${q},city=${city},sort=${sort},lastName=${legacyLastName})}"><span th:text="#{clinic.next}">Next →</span></a></nav></main></body></html>
