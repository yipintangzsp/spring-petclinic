<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'owners')}">
<body><main class="clinic-workspace">
<nav class="breadcrumbs"><a th:href="@{/owners}"><span th:text="#{clinic.owners}">Owners</span></a><span><span th:text="#{clinic.owner.details}"> / Owner details</span></span></nav>
<header class="workspace-heading">
<div>
<p class="eyebrow"><span th:text="#{clinic.household.record}">HOUSEHOLD RECORD</span></p>
<h1 th:text="${owner.firstName + ' ' + owner.lastName}"></h1>
<p th:text="'Owner #' + ${owner.id} + ' · ' + ${#lists.size(owner.pets)} + ' pets registered'"></p></div>
<div class="action-row"><a class="btn btn-outline-primary" th:href="@{/owners/{id}/edit(id=${owner.id})}"><span th:text="#{clinic.edit.owner}">Edit owner</span></a><a class="btn btn-primary" th:href="@{/owners/{id}/pets/new(id=${owner.id})}"><span th:text="#{clinic.add.pet}">Add pet</span></a></div></header>
<div th:if="${message}" class="alert alert-success" role="status" th:text="${message}"></div>
<div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>
<section class="record-panel">
<h2><span th:text="#{clinic.contact.address}">Contact &amp; address</span></h2><dl class="record-facts">
<div><dt><span th:text="#{clinic.telephone}">Telephone</span></dt><dd><a th:href="'tel:' + ${owner.telephone}" th:text="${owner.telephone}"></a></dd></div>
<div><dt><span th:text="#{clinic.address}">Address</span></dt><dd th:text="${owner.address}"></dd></div>
<div><dt><span th:text="#{clinic.city}">City</span></dt><dd th:text="${owner.city}"></dd></div></dl></section>
<h2><span th:text="#{clinic.pets.care.history}">Pets &amp; care history</span></h2>
<section class="empty-state" th:if="${#lists.isEmpty(owner.pets)}">
<p><span th:text="#{clinic.this.household.has.no.registered.pets}">This household has no registered pets.</span></p><a th:href="@{/owners/{id}/pets/new(id=${owner.id})}"><span th:text="#{clinic.register.the.first.pet}">Register the first pet →</span></a></section>
<div class="care-grid">
<article class="record-panel" th:each="pet : ${owner.pets}">
<div class="card-heading">
<h3><a th:href="@{/owners/{o}/pets/{p}(o=${owner.id},p=${pet.id})}" th:text="${pet.name}"></a></h3><span class="tag" th:text="${pet.type}"></span></div>
<p th:text="'Born ' + ${pet.birthDate}"></p>
<p class="cell-note" th:text="${#lists.size(pet.visitHistory)} + ' saved visits · newest first'"></p>
<p th:if="${#lists.isEmpty(pet.visitHistory)}"><span th:text="#{clinic.no.visits.recorded.yet}">No visits recorded yet.</span></p>
<ol class="visit-timeline">
<li th:each="visit, state : ${pet.visitHistory}" th:if="${state.index < 3}"><time th:text="${visit.date}"></time>
<p th:text="${visit.description}"></p></li></ol>
<div class="action-row"><a class="btn btn-outline-primary" th:href="@{/owners/{o}/pets/{p}(o=${owner.id},p=${pet.id})}"><span th:text="#{clinic.pet.details.all.visits}">Pet details &amp; all visits</span></a><a th:href="@{/owners/{o}/pets/{p}/visits/new(o=${owner.id},p=${pet.id})}"><span th:text="#{clinic.add.visit.link}">Add visit →</span></a></div></article></div>
</main></body></html>
