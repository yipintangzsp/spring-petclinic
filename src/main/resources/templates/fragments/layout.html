<!DOCTYPE html>

<html th:fragment="layout (template, menu)" xmlns:th="https://www.thymeleaf.org">

<head>

  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="shortcut icon" type="image/x-icon" th:href="@{/resources/images/favicon.png}">
  <title th:text="#{layoutTitle}">PetClinic :: a Spring Framework demonstration</title>
  <link th:href="@{/webjars/font-awesome/css/font-awesome.min.css}" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/resources/css/petclinic.css}" />
  <link rel="stylesheet" th:href="@{/resources/css/clinic-workspace.css}" />
  <link rel="stylesheet" th:href="@{/resources/css/clinic-modern.css}" />
  <link rel="stylesheet" th:href="@{/resources/css/clinic-vivid.css(v=${@environment.getProperty('APPLICATION_VERSION','local')})}" />

</head>

<body>

  <nav class="navbar navbar-expand-lg navbar-light product-nav" role="navigation">
    <div class="container-fluid">
      <a class="navbar-brand product-brand" th:href="@{/}"><i class="fa fa-paw"></i><span th:text="'Petclinic'">Petclinic</span><small th:text="'everyday care'">cloud native</small></a>
      <button class="navbar-toggler" aria-label="Toggle navigation" aria-controls="main-navbar" type="button" data-bs-toggle="collapse" data-bs-target="#main-navbar">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="main-navbar" style>

        <ul class="navbar-nav me-auto mb-2 mb-lg-0" th:remove="all">

          <li th:fragment="menuItem (link,active,title,glyph,text)" th:class="nav-item">
            <a th:class="${active==menu ? 'nav-link active' : 'nav-link'}" th:href="@{__${link}__}" th:title="${title}">
              <span th:class="'fa fa-'+${glyph}" class="fa fa-home"></span>
              <span th:text="${text}">Template</span>
            </a>
          </li>

        </ul>

        <ul class="nav navbar-nav me-auto">

          <li th:replace="~{::menuItem ('/','home','home page','home',#{home})}">
            <span class="fa fa-home" aria-hidden="true"></span>
            <span th:text="#{home}">Home</span>
          </li>

          <li th:replace="~{::menuItem ('/owners','owners','owners','users','Owners')}">
            <span class="fa fa-search" aria-hidden="true"></span>
            <span th:text="#{findOwners}">Find owners</span>
          </li>

          <li th:replace="~{::menuItem ('/pets','pets','pets','paw','Pets')}"><span th:text="'Pets'">Pets</span></li>

          <li th:replace="~{::menuItem ('/vets.html','vets','veterinarians','th-list',#{vets})}">
            <span class="fa fa-th-list" aria-hidden="true"></span>
            <span th:text="#{vets}">Veterinarians</span>
          </li>


        </ul>
        <a class="nav-care-cta" th:href="@{/pets}" th:text="#{clinic.modern.find.pet}">Find your pet</a>
      </div>
    </div>
  </nav>
  <div class="page-shell">
    <div class="container xd-container" th:classappend="${menu == 'home' ? 'home-container' : ''}">

      <th:block th:insert="${template}" />

    </div>
  </div>

  <footer class="product-footer"><div class="container"><span th:text="'Petclinic'"><i class="fa fa-paw"></i> Petclinic</span><p th:text="#{clinic.modern.footer}">Connected people. Better care.</p><a class="footer-status" th:href="@{/system-status}" th:text="#{clinic.modern.system.status}">System status</a><img th:src="@{/resources/images/spring-logo.svg}" alt="Spring" class="logo"></div></footer>

  <script th:src="@{/webjars/bootstrap/dist/js/bootstrap.bundle.min.js}"></script>

</body>

</html>
