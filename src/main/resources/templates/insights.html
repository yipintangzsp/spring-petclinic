<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'insights')}">
<body>
<section class="insight-heading">
  <p class="insight-eyebrow" th:text="#{insights.eyebrow}"></p>
  <h1 th:text="#{insights.title}"></h1>
  <p th:text="#{insights.intro}"></p>
  <a th:href="@{/owners}" th:text="#{insights.back}"></a>
</section>
<form method="get" th:action="@{/insights}" class="insight-filter" id="insight-filter">
  <label for="from"><span th:text="#{insights.from}"></span><input type="date" id="from" name="from" th:value="${from}" required></label>
  <span aria-hidden="true" th:text="'—'"></span>
  <label for="to"><span th:text="#{insights.to}"></span><input type="date" id="to" name="to" th:value="${to}" required></label>
  <button type="submit" id="filter-button" th:text="#{insights.submit}"></button>
  <p id="filter-status" role="status" aria-live="polite"></p>
</form>
<section th:if="${!analytics.available}" class="insight-empty" role="status">
  <h2 th:text="${analytics.failed} ? #{insights.unavailable} : #{insights.waiting}"></h2>
  <p th:text="#{insights.missing}"></p>
  <a th:href="@{/pets}" th:text="#{insights.petsLink}"></a>
</section>
<th:block th:if="${analytics.available}">
  <div class="insight-provenance">
    <strong th:text="${analytics.run.sourceKind == 'demo'} ? #{insights.demo} : #{insights.business}"></strong>
    <span><span th:text="#{insights.updated}"></span> <time th:text="${analytics.run.generatedAt}"></time></span>
  </div>
  <p th:if="${analytics.failed}" class="insight-notice" role="alert" th:text="#{insights.failed}"></p>
  <p th:if="${outOfWindow}" class="insight-notice" role="status" th:text="#{insights.coverage(${analytics.run.start},${analytics.run.end})}"></p>
  <div class="insight-counts">
    <article><span th:text="#{insights.visits}"></span><strong id="visit-count" th:text="${visitCount}">0</strong><small th:text="#{insights.future}"></small></article>
    <article><span th:text="#{insights.owners}"></span><strong th:text="${analytics.run.owners}">0</strong><small th:text="#{insights.snapshot}"></small></article>
    <article><span th:text="#{insights.pets}"></span><strong th:text="${analytics.run.pets}">0</strong><small th:text="#{insights.snapshot}"></small></article>
    <article><span th:text="#{insights.vets}"></span><strong th:text="${analytics.run.vets}">0</strong><small th:text="#{insights.snapshot}"></small></article>
  </div>
  <div class="insight-panels">
    <section class="insight-panel"><header><span class="insight-eyebrow" th:text="#{insights.trendEyebrow}"></span><h2 th:text="#{insights.trend}"></h2><p th:text="#{insights.trendNote}"></p></header>
      <p th:if="${days.isEmpty()}" class="insight-empty" id="empty-range" th:text="#{insights.empty}"></p>
      <div class="insight-trend" th:unless="${days.isEmpty()}" role="list" th:aria-label="#{insights.dailyLabel}">
        <div class="insight-day" th:each="day : ${days}" role="listitem"><time th:text="${day.date}"></time><span class="insight-bar-track"><span class="insight-bar" th:style="'width:' + (${day.visits} * 100.0 / ${peak}) + '%'"></span></span><strong th:text="${day.visits}"></strong></div>
      </div>
    </section>
    <section class="insight-panel"><header><span class="insight-eyebrow" th:text="#{insights.typesEyebrow}"></span><h2 th:text="#{insights.types}"></h2><p th:text="#{insights.typesNote}"></p></header>
      <ul class="insight-types"><li th:each="type : ${analytics.types}"><span th:text="${type.name}"></span><strong th:text="${type.pets}"></strong></li></ul>
      <p class="insight-footnote" th:text="#{insights.footnote}"></p>
    </section>
  </div>
</th:block>
<script th:inline="javascript">
  document.getElementById('insight-filter').addEventListener('submit', function(event) {
    const start = new Date(document.getElementById('from').value);
    const end = new Date(document.getElementById('to').value);
    const status = document.getElementById('filter-status');
    if (end < start || (end - start) / 86400000 > 365) {
      event.preventDefault(); status.textContent = /*[[#{insights.invalid}]]*/ 'Choose a valid date range.'; return;
    }
    document.getElementById('filter-button').disabled = true;
    status.textContent = /*[[#{insights.loading}]]*/ 'Loading insights…';
  });
</script>
</body>
</html>
