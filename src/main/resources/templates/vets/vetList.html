<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'vets')}">
<body><main class="clinic-workspace">
<header class="workspace-heading">
<div>
<p class="eyebrow"><span th:text="#{clinic.clinic.team.database.records}">CLINIC TEAM · DATABASE RECORDS</span></p>
<h1><span th:text="#{clinic.veterinarians}">Veterinarians</span></h1>
<p><span th:text="#{clinic.explore.the.expertise.recorded.for.our.veterinary.team}">Explore the expertise recorded for our veterinary team.</span></p></div></header>
<form class="filter-bar" method="get" th:action="@{/vets.html}">
<label><span th:text="#{clinic.veterinarian.name}">Veterinarian name</span><input class="form-control" name="q" th:value="${q}" placeholder="e.g. Helen" maxlength="100"></label>
<label><span th:text="#{clinic.specialty}">Specialty</span><select class="form-control" name="specialty"><option value="" th:text="#{clinic.all.specialties}">All specialties</option><option value="general" th:selected="${specialty == 'general'}" th:text="#{clinic.no.specialty.listed}">No specialty listed</option><option th:each="item : ${specialties}" th:value="${item}" th:text="${item}" th:selected="${item == specialty}"></option></select></label><button class="btn btn-primary"><span th:text="#{clinic.apply.filters}">Apply filters</span></button><a th:href="@{/vets.html}"><span th:text="#{clinic.clear}">Clear</span></a></form>
<p class="result-count" th:text="${totalItems} + ' matching veterinarians · sorted by last name'"></p>
<section class="empty-state" th:if="${#lists.isEmpty(listVets)}">
<h2><span th:text="#{clinic.no.veterinarians.found}">No veterinarians found</span></h2>
<p><span th:text="#{clinic.try.another.name.or.specialty}">Try another name or specialty.</span></p><a th:href="@{/vets.html}"><span th:text="#{clinic.show.all.veterinarians}">Show all veterinarians</span></a></section>
<div class="care-grid" id="vets">
<article class="record-panel" th:each="vet : ${listVets}">
<p class="eyebrow"><span th:text="#{clinic.veterinarian}">VETERINARIAN</span></p>
<h2 th:text="${vet.firstName + ' ' + vet.lastName}"></h2>
<div class="specialty-tags"><a class="tag" th:each="item : ${vet.specialties}" th:href="@{/vets.html(specialty=${item.name})}" th:text="${item.name}"></a><span class="tag" th:if="${vet.nrOfSpecialties == 0}"><span th:text="#{clinic.no.specialty.listed}">No specialty listed</span></span></div>
<p class="cell-note" th:text="${vet.nrOfSpecialties} + ' specialties recorded'"></p></article></div>
<nav class="pager" aria-label="Pagination" th:if="${totalPages > 1}"><a class="btn btn-outline-primary" th:if="${currentPage > 1}" th:href="@{/vets.html(page=${currentPage - 1},q=${q},specialty=${specialty})}">← Previous</a><span th:text="'Page ' + ${currentPage} + ' of ' + ${totalPages}"></span><a class="btn btn-outline-primary" th:if="${currentPage < totalPages}" th:href="@{/vets.html(page=${currentPage + 1},q=${q},specialty=${specialty})}"><span th:text="#{clinic.next}">Next →</span></a></nav></main></body></html>
