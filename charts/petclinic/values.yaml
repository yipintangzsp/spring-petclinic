# Current GitOps snapshot; Secret references only. Image digest is authoritative.
name: petclinic
replicaCount: 3
image:
  repository: core.harbor.domain/petclinic/petclinic
  digest: sha256:489cb821573ff1f98edd846d5949d74bf3391b24e2f1fe5bcfb71c6be0793137
  pullPolicy: IfNotPresent
deploymentAnnotations:
  gitops.zhanglab.io/cutover-test: v1.27
deployment:
  minReadySeconds: 10
  progressDeadlineSeconds: 600
  revisionHistoryLimit: 5
selector:
  app: petclinic
podLabels:
  app: petclinic
podAnnotations: {}
service:
  type: ClusterIP
  selector:
    app: petclinic
  ports:
  - name: http
    port: 80
    targetPort: http
ingress:
  enabled: true
  spec:
    ingressClassName: traefik
    rules:
    - host: petclinic.devops.local
      http:
        paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: petclinic
              port:
                number: 80
configMap:
  name: petclinic-config
  data:
    SPRING_PROFILES_ACTIVE: postgres
    POSTGRES_URL: jdbc:postgresql://postgresql.ns-data.svc.cluster.local:5432/petclinic
pdb:
  minAvailable: 2
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      app: petclinic
monitoring:
  enabled: true
serviceAccount:
  create: false
  name: ''
env:
- name: SERVER_COMPRESSION_ENABLED
  value: 'true'
- name: SERVER_COMPRESSION_MIN_RESPONSE_SIZE
  value: 2KB
- name: SERVER_COMPRESSION_MIME_TYPES
  value: text/plain,application/openmetrics-text
- name: SPRING_SQL_INIT_MODE
  value: never
- name: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
  value: '6'
- name: SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE
  value: '2'
- name: SERVER_SHUTDOWN
  value: graceful
- name: SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE
  value: 25s
- name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
  value: health,info,prometheus,metrics
- name: MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED
  value: 'false'
- name: MANAGEMENT_TRACING_EXPORT_OTLP_ENABLED
  value: 'true'
- name: MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT
  value: http://otel-collector.monitoring.svc.cluster.local:4318/v1/traces
- name: MANAGEMENT_TRACING_SAMPLING_PROBABILITY
  value: '1.0'
- name: APPLICATION_VERSION
  value: 0.10.0-ci-218
- name: BUILD_NUMBER
  value: '218'
- name: BUILD_GIT_COMMIT
  value: 1fc223cb01a153b66e00ddbbff1b3b517a9784b1
- name: BUILD_TIME
  value: '2026-10-27T04:59:35.090Z'
- name: SPRING_PROFILES_ACTIVE
  valueFrom:
    configMapKeyRef:
      name: petclinic-config
      key: SPRING_PROFILES_ACTIVE
- name: POSTGRES_URL
  valueFrom:
    configMapKeyRef:
      name: petclinic-config
      key: POSTGRES_URL
- name: POSTGRES_USER
  valueFrom:
    secretKeyRef:
      name: petclinic-db
      key: POSTGRES_USER
- name: POSTGRES_PASS
  valueFrom:
    secretKeyRef:
      name: petclinic-db
      key: POSTGRES_PASS
envFrom: []
ports:
- name: http
  containerPort: 8080
resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 768Mi
startupProbe:
  httpGet:
    path: /actuator/health/liveness
    port: http
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 36
readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: http
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 6
livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: http
  periodSeconds: 15
  timeoutSeconds: 3
  failureThreshold: 3
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault
securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
nodeSelector:
  kubernetes.io/os: linux
  kubernetes.io/hostname: devops
tolerations:
- key: cloud
  operator: Equal
  value: 'true'
  effect: NoSchedule
affinity: {}
topologySpreadConstraints:
- maxSkew: 1
  topologyKey: kubernetes.io/hostname
  whenUnsatisfiable: ScheduleAnyway
  labelSelector:
    matchLabels:
      app: petclinic
  matchLabelKeys:
  - pod-template-hash
imagePullSecrets:
- name: petclinic-harbor-pull
automountServiceAccountToken: false
terminationGracePeriodSeconds: 45
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 0
    maxUnavailable: 1
volumeMounts:
- name: runtime-tmp
  mountPath: /tmp
- name: platform-snapshot
  mountPath: /etc/petclinic-platform
  readOnly: true
volumes:
- name: runtime-tmp
  emptyDir:
    sizeLimit: 128Mi
- name: platform-snapshot
  configMap:
    name: petclinic-platform-snapshot
    optional: true
lifecycle:
  preStop:
    exec:
      command:
      - /bin/sh
      - -c
      - sleep 5
